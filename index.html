<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CyberCode</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff2a5f;
            --accent-purple: #9d4edf;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --nav-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .page { display: none; flex: 1; flex-direction: column; padding: 20px; overflow-y: auto; padding-bottom: 90px; }
        .page.active { display: flex; }

        .greeting { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .greeting span { color: var(--accent-cyan); text-shadow: 0 0 12px var(--accent-cyan); }

        .timer-badge {
            background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan); padding: 6px 14px; border-radius: 20px;
            font-size: 0.85rem; font-family: monospace; font-weight: bold;
            display: flex; align-items: center; gap: 6px;
        }

        .search-box {
            background: var(--card-bg); border: 1px solid #1f2937; border-radius: 30px;
            padding: 12px 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
        }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-size: 0.95rem; }

        .section-card {
            background: var(--card-bg); border-radius: 20px;
            padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-code { border-left: 4px solid var(--accent-cyan); }
        .card-file { border-left: 4px solid var(--accent-purple); }

        .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; }
        .sub-text { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }

        .glow-btn {
            width: 100%; padding: 14px 20px; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: bold; text-transform: uppercase;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .btn-cyan { background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; }
        .btn-purple { background: linear-gradient(135deg, #9d4edf, #ff2a5f); color: #fff; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100vw; height: 65px;
            background: var(--nav-bg); border-top: 1px solid #1f2937; display: flex;
            justify-content: space-around; align-items: center; z-index: 50;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.75rem; cursor: pointer; flex: 1;
        }
        .nav-item.active { color: var(--accent-cyan); font-weight: bold; }

        #editor-window {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color); z-index: 999; display: none; flex-direction: column;
        }
        header { background: var(--card-bg); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--accent-cyan); }
        .tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid #1f2937; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #fff; cursor: pointer; font-weight: bold; opacity: 0.6; }
        .tab-btn.active { color: var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); opacity: 1; }

        .CodeMirror { flex: 1; height: auto !important; font-family: 'Consolas', monospace; font-size: 15px; background: var(--bg-color) !important; color: #f8f8f2 !important; }
        iframe { width: 100%; flex: 1; border: none; border-radius: 12px; background: #fff; }
    </style>
</head>
<body>

    <div id="page-home" class="page active">
        <div class="greeting">
            <span>HTML CyberCode</span>
            <div class="timer-badge">⏱ <span id="vcr-timer">00:00:00</span></div>
        </div>

        <div class="search-box">
            🌐 <input type="text" id="url-input" placeholder="Search or type web URL" onkeypress="handleUrlSearch(event)">
        </div>

        <div class="section-card card-code">
            <div class="section-title" style="color:var(--accent-cyan);">⚡ CODE STUDIO</div>
            <div class="sub-text">Build & test Python, HTML, CSS, JS with syntax highlighting.</div>
            <button class="glow-btn btn-cyan" onclick="openEditor()"><span>🚀 OPEN IDE STUDIO</span></button>
        </div>

        <div class="section-card card-file">
            <div class="section-title" style="color:var(--accent-purple);">📁 QUICK FILE LOADER</div>
            <div class="sub-text">Load existing HTML files directly from mobile storage.</div>
            <button class="glow-btn btn-purple" onclick="triggerFileLoader()"><span>📂 LOAD HTML FILE</span></button>
        </div>
    </div>

    <div id="page-browser" class="page">
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" id="browser-url" placeholder="https://google.com" style="flex:1; padding:10px; border-radius:8px; border:1px solid #374151; background:#111827; color:#fff;">
            <button onclick="loadBrowserUrl()" style="padding:10px 15px; background:var(--accent-cyan); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Go</button>
        </div>
        <iframe id="browser-frame" src="about:blank"></iframe>
    </div>

    <div id="page-history" class="page">
        <h2>⏱ Browsing History</h2>
        <div style="margin-top:15px; color:var(--text-muted);">No recent history available.</div>
    </div>

    <div id="page-settings" class="page">
        <h2>⚙️ Settings</h2>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('home', this)"><span>🏠</span><span>Home</span></div>
        <div class="nav-item" onclick="switchPage('browser', this)"><span>🌐</span><span>Browser</span></div>
        <div class="nav-item" onclick="switchPage('history', this)"><span>⏱</span><span>History</span></div>
        <div class="nav-item" onclick="switchPage('settings', this)"><span>⚙️</span><span>Settings</span></div>
    </div>

    <div id="editor-window">
        <header>
            <button style="background:var(--accent-pink); color:#fff; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="closeEditor()">⬅ Home</button>
            <span style="font-weight:bold; color:var(--accent-cyan);">HTML CyberCode IDE</span>
            <button style="background:var(--accent-cyan); color:#000; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="runCode()">▶ Run</button>
        </header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchLanguage('python', this)">Python</button>
            <button class="tab-btn" onclick="switchLanguage('htmlmixed', this)">HTML</button>
            <button class="tab-btn" onclick="switchLanguage('css', this)">CSS</button>
            <button class="tab-btn" onclick="switchLanguage('javascript', this)">JS</button>
        </div>
        <textarea id="code-editor"></textarea>
    </div>

    <input type="file" id="file-input" style="display:none;" onchange="handleFileLoad(event)">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <script>
        var editor = null;
        var secondsSpent = 0;

        var codeTemplates = {
            python: '# Python CyberCode\ndef welcome():\n    print("Hello from CyberCode!")\n\nwelcome()',
            htmlmixed: '<!DOCTYPE html>\n<html>\n<head>\n    <title>Page Title</title>\n</head>\n<body>\n    <h1>Hello CyberCode</h1>\n</body>\n</html>',
            css: 'body {\n    background-color: #0b0f19;\n    color: #00f0ff;\n    text-align: center;\n}',
            javascript: 'function greet() {\n    alert("Hello CyberCode!");\n}\ngreet();'
        };

        setInterval(function() {
            secondsSpent++;
            var hrs = String(Math.floor(secondsSpent / 3600)).padStart(2, '0');
            var mins = String(Math.floor((secondsSpent % 3600) / 60)).padStart(2, '0');
            var secs = String(secondsSpent % 60).padStart(2, '0');
            var timerEl = document.getElementById('vcr-timer');
            if(timerEl) timerEl.innerText = hrs + ':' + mins + ':' + secs;
        }, 1000);

        window.onload = function() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                lineNumbers: true,
                mode: "python",
                theme: "dracula",
                tabSize: 4,
                lineWrapping: true
            });
            editor.setValue(codeTemplates.python);
        };

        function switchPage(pageId, element) {
            var pages = document.querySelectorAll('.page');
            for(var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            var navItems = document.querySelectorAll('.nav-item');
            for(var i = 0; i < navItems.length; i++) {
                navItems[i].classList.remove('active');
            }
            var target = document.getElementById('page-'' + pageId); // Fixed string concatenation
            var targetPage = document.getElementById('page-' + pageId);
            if(targetPage) targetPage.classList.add('active');
            if(element) element.classList.add('active');
        }

        function openEditor() {
            var win = document.getElementById('editor-window');
            if(win) {
                win.style.display = 'flex';
                if(editor) {
                    setTimeout(function() { editor.refresh(); }, 50);
                }
            }
        }

        function closeEditor() {
            var win = document.getElementById('editor-window');
            if(win) win.style.display = 'none';
        }

        function switchLanguage(mode, btn) {
            var btns = document.querySelectorAll('.tab-btn');
            for(var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            if(btn) btn.classList.add('active');
            if(editor) {
                editor.setOption("mode", mode);
                if(codeTemplates[mode]) {
                    editor.setValue(codeTemplates[mode]);
                }
            }
        }

        function runCode() {
            if(!editor) return;
            var code = editor.getValue();
            var mode = editor.getOption("mode");
            var outputWindow = window.open("", "_blank");
            if(outputWindow) {
                outputWindow.document.open();
                outputWindow.document.write(code);
                outputWindow.document.close();
            }
        }

        function triggerFileLoader() {
            var fileInput = document.getElementById('file-input');
            if(fileInput) fileInput.click();
        }

        function loadBrowserUrl() {
            var urlInput = document.getElementById('browser-url');
            var browserFrame = document.getElementById('browser-frame');
            if(urlInput && browserFrame) {
                var url = urlInput.value;
                if(url.indexOf('http') !== 0) url = 'https://' + url;
                browserFrame.src = url;
            }
        }

        function handleUrlSearch(e) {
            if(e.keyCode === 13 || e.key === 'Enter') {
                var urlInput = document.getElementById('url-input');
                if(urlInput) {
                    var val = urlInput.value;
                    switchPage('browser', document.querySelectorAll('.nav-item')[1]);
                    var browserUrl = document.getElementById('browser-url');
                    if(browserUrl) browserUrl.value = val;
                    loadBrowserUrl();
                }
            }
        }

        function handleFileLoad(e) {
            var file = e.target.files[0];
            if(file) {
                var reader = new FileReader();
                reader.onload = function(event) {
                    if(editor) {
                        editor.setValue(event.target.result);
                        openEditor();
                    }
                };
                reader.readAsText(file);
            }
        }
    </script>
</body>
</html>
